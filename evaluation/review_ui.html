<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mapping-Review: Moody's ↔ SEC</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a2330; --mut:#67707e; --line:#e3e6ea;
          --ok:#0a7d33; --okbg:#e8f6ec; --warn:#9a6b00; --warnbg:#fdf3d8;
          --no:#8a3ffc; --nobg:#f1eaff; --acc:#0f62fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 18px; }
  h1 { font-size:16px; margin:0 0 6px; }
  .bar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .prog { flex:1; min-width:180px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--ok); }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:3px 10px; cursor:pointer; font-size:12.5px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { max-width:1060px; margin:14px auto 80px; padding:0 14px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:8px; padding:10px 12px; }
  .row.decided { opacity:.78; }
  .top { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .mname { font-weight:650; font-size:14.5px; }
  .id { color:var(--mut); font-size:12px; }
  .badge { font-size:11.5px; border-radius:4px; padding:1px 6px; }
  .b-rat { background:#e5eefc; color:#174a9c; font-weight:600; }
  .b-in { background:var(--okbg); color:var(--ok); }
  .b-out { background:#f2f2f2; color:var(--mut); }
  .b-unc { background:var(--warnbg); color:var(--warn); }
  .b-st-confirmed { background:var(--okbg); color:var(--ok); font-weight:600; }
  .b-st-no_sec_filer, .b-st-not_rated { background:var(--nobg); color:var(--no); font-weight:600; }
  .map { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .arrow { color:var(--mut); }
  .target { background:#f2f6ff; border:1px solid #d4e0f7; border-radius:6px; padding:3px 8px; font-size:13px; }
  .target.none { background:#faf7ff; border-color:#e4d9fb; }
  .why { color:var(--mut); font-size:12px; margin-top:4px; }
  .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  button { border:1px solid var(--line); background:var(--card); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
  button.subtle { color:var(--mut); }
  button:hover { filter:brightness(.96); }
  .search { margin-top:8px; display:none; }
  .search input { width:min(420px,100%); padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .hits { border:1px solid var(--line); border-radius:6px; margin-top:4px; max-height:220px; overflow:auto; background:var(--card); }
  .hit { padding:5px 8px; cursor:pointer; border-bottom:1px solid var(--line); font-size:13px; }
  .hit:hover { background:#eef3fe; }
  .decinfo { color:var(--mut); font-size:12px; margin-top:6px; }
  .note-in { width:min(420px,100%); padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; }
  .sec { margin:22px 0 10px; font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; }
</style>
</head>
<body>
<header>
  <h1>Mapping-Review: Moody's-Entität ↔ SEC-Filer (CIK)</h1>
  <div class="bar">
    <div class="prog"><i id="pfill" style="width:0%"></i></div>
    <span id="ptext" class="id"></span>
  </div>
  <div class="bar" style="margin-top:6px">
    <span class="chip on" data-f="alle">Alle</span>
    <span class="chip" data-f="offen">Offen</span>
    <span class="chip" data-f="entschieden">Entschieden</span>
    <span class="chip" data-f="aktiv">Nur aktiv bewertete</span>
    <span class="chip" data-f="scope">Nur Scope „in“/„uncertain“</span>
  </div>
</header>
<main id="list"></main>
<script>
let ITEMS = [], FILTER = "alle";
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() { ITEMS = await (await fetch("/api/state")).json(); render(); }

function visible(it) {
  if (FILTER === "offen") return it.status === "pending";
  if (FILTER === "entschieden") return it.status !== "pending";
  if (FILTER === "aktiv") return it.kind !== "moodys" || !!it.current;
  if (FILTER === "scope") return it.kind !== "moodys" || it.scope === "in" || it.scope === "uncertain";
  return true;
}

function progress() {
  const rel = ITEMS.filter(i => i.kind !== "moodys" || !!i.current);
  const done = rel.filter(i => i.status !== "pending").length;
  const all = ITEMS.filter(i => i.status !== "pending").length;
  $("#pfill").style.width = (rel.length ? 100 * done / rel.length : 0) + "%";
  $("#ptext").textContent = `${done}/${rel.length} aktiv bewertete entschieden · ${all}/${ITEMS.length} gesamt`;
}

function statusBadge(it) {
  if (it.status === "confirmed") return `<span class="badge b-st-confirmed">✓ bestätigt</span>`;
  if (it.status === "no_sec_filer") return `<span class="badge b-st-no_sec_filer">kein SEC-Filer</span>`;
  if (it.status === "not_rated") return `<span class="badge b-st-not_rated">nicht von Moody's geratet</span>`;
  return "";
}

function row(it) {
  const d = document.createElement("div");
  d.className = "row" + (it.status !== "pending" ? " decided" : "");
  d.dataset.key = it.key;
  if (it.kind === "moodys") {
    const cur = it.current ? `<span class="badge b-rat">${esc(it.current.rating)} · ${esc(it.current.date)}</span>`
                           : `<span class="badge b-out">kein aktives Rating</span>`;
    const sb = {in:"b-in", out:"b-out", uncertain:"b-unc"}[it.scope] || "b-out";
    const tgtName = it.status === "confirmed" ? it.decided_edgar_name : it.proposed_edgar_name;
    const tgtCik  = it.status === "confirmed" ? it.decided_cik : it.proposed_cik;
    const grp = it.group && it.group !== it.moodys_name ? ` <span class="id">· Gruppe: ${esc(it.group)}</span>` : "";
    d.innerHTML = `
      <div class="top">
        <span class="mname">${esc(it.moodys_name)}</span>
        <span class="id">OI ${esc(it.oi)}</span> ${cur}
        <span class="badge ${sb}">${esc(it.scope)}</span> ${statusBadge(it)}
      </div>
      <div class="map">
        <span class="arrow">→ SEC-Bilanz von:</span>
        ${tgtCik ? `<span class="target"><b>${esc(tgtName) || "?"}</b> · CIK ${tgtCik}</span>`
                 : `<span class="target none">kein Vorschlag</span>`}
        ${grp}
      </div>
      <div class="why">${esc(it.sic || "")} ${esc(it.sic_desc || "")} · ${esc(it.filing_status || "Filing-Status unbekannt")}${it.scope_reason ? " · " + esc(it.scope_reason) : ""}</div>
      ${it.status === "pending" ? `
      <div class="acts">
        ${it.proposed_cik ? `<button class="ok" data-a="confirm">✓ Vorschlag bestätigen</button>` : ""}
        <button data-a="search">Anderen SEC-Filer suchen…</button>
        <button class="subtle" data-a="no_sec_filer">Hat keinen SEC-Filer (privat/ausländisch)</button>
        <input class="note-in" placeholder="Notiz (optional, wird mitgespeichert)">
      </div>
      <div class="search"><input placeholder="EDGAR-Namen durchsuchen (min. 2 Zeichen)…"><div class="hits"></div></div>`
      : `<div class="acts"><button class="subtle" data-a="pending">↩︎ Entscheidung zurücknehmen</button></div>
         <div class="decinfo">entschieden von ${esc(it.decided_by)} am ${esc(it.decided_at)}${it.note ? " · Notiz: " + esc(it.note) : ""}</div>`}
    `;
  } else {
    d.innerHTML = `
      <div class="top">
        <span class="mname">${esc(it.edgar_name)}</span>
        <span class="id">CIK ${it.cik} · ${esc(it.sic)} ${esc(it.sic_desc)}</span> ${statusBadge(it)}
      </div>
      <div class="why">Gegenrichtung: gelisteter Retail-Filer ohne Moody's-Zuordnung. Ratet Moody's dieses Unternehmen (ggf. unter anderem Namen)?</div>
      ${it.status === "pending" ? `
      <div class="acts">
        <button data-a="search">Moody's-Entität suchen…</button>
        <button class="subtle" data-a="not_rated">Nicht von Moody's geratet</button>
        <input class="note-in" placeholder="Notiz (optional)">
      </div>
      <div class="search"><input placeholder="Moody's-Namen durchsuchen…"><div class="hits"></div></div>`
      : `<div class="acts"><button class="subtle" data-a="pending">↩︎ Entscheidung zurücknehmen</button></div>
         <div class="decinfo">entschieden von ${esc(it.decided_by)} am ${esc(it.decided_at)}${it.decided_moodys_name ? " · → " + esc(it.decided_moodys_name) + " (OI " + esc(it.decided_oi) + ")" : ""}${it.note ? " · Notiz: " + esc(it.note) : ""}</div>`}
    `;
  }
  return d;
}

function render() {
  progress();
  const list = $("#list"); list.innerHTML = "";
  const m = ITEMS.filter(i => i.kind === "moodys" && visible(i));
  const e = ITEMS.filter(i => i.kind === "edgar" && visible(i));
  if (m.length) { const h = document.createElement("div"); h.className = "sec";
    h.textContent = `Moody's → SEC (${m.length})`; list.appendChild(h); m.forEach(i => list.appendChild(row(i))); }
  if (e.length) { const h = document.createElement("div"); h.className = "sec";
    h.textContent = `Gegenrichtung: SEC-Retailer ohne Moody's-Zuordnung (${e.length})`; list.appendChild(h); e.forEach(i => list.appendChild(row(i))); }
}

async function post(payload) {
  const r = await fetch("/api/decide", {method:"POST", body: JSON.stringify(payload)});
  const it = await r.json();
  if (it.error) { alert(it.error); return; }
  const idx = ITEMS.findIndex(x => x.key === it.key); ITEMS[idx] = it;
  const old = document.querySelector(`[data-key="${it.key}"]`);
  old.replaceWith(row(it)); progress();
}

document.addEventListener("click", async ev => {
  const chip = ev.target.closest(".chip");
  if (chip) { document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on"); FILTER = chip.dataset.f; render(); return; }
  const btn = ev.target.closest("button"); if (!btn) return;
  const rowEl = btn.closest(".row"); const key = rowEl.dataset.key;
  const it = ITEMS.find(x => x.key === key);
  const note = rowEl.querySelector(".note-in")?.value || "";
  const a = btn.dataset.a;
  if (a === "search") { const s = rowEl.querySelector(".search");
    s.style.display = s.style.display === "block" ? "none" : "block"; s.querySelector("input").focus(); return; }
  if (a) await post({key, action:a, note});
  const hit = ev.target.closest(".hit");
  if (hit) {
    const p = {key, action:"set", note};
    if (it.kind === "moodys") { p.cik = hit.dataset.cik; p.name = hit.dataset.name; }
    else { p.oi = hit.dataset.oi; p.name = hit.dataset.name; }
    await post(p);
  }
});

let t = null;
document.addEventListener("input", ev => {
  const inp = ev.target.closest(".search input"); if (!inp) return;
  clearTimeout(t);
  t = setTimeout(async () => {
    const rowEl = inp.closest(".row");
    const it = ITEMS.find(x => x.key === rowEl.dataset.key);
    const side = it.kind === "moodys" ? "edgar" : "moodys";
    const hits = await (await fetch(`/api/search?side=${side}&q=${encodeURIComponent(inp.value)}`)).json();
    rowEl.querySelector(".hits").innerHTML = hits.map(h =>
      side === "edgar"
        ? `<div class="hit" data-cik="${h.cik}" data-name="${esc(h.name)}">${esc(h.name)} <span class="id">CIK ${h.cik}</span></div>`
        : `<div class="hit" data-oi="${esc(h.oi)}" data-name="${esc(h.name)}">${esc(h.name)} <span class="id">OI ${esc(h.oi)}</span></div>`
    ).join("") || `<div class="hit" style="cursor:default">keine Treffer</div>`;
  }, 200);
});

load();
</script>
</body>
</html>
